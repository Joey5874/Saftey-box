<!DOCTYPE html>
<html>
<head>
  <title>Lock Box Puzzle</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    #pinPad button {
      font-size: 24px;
      margin: 5px;
      padding: 10px 20px;
    }
    .screen {
      display: none;
    }
    .visible {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Welcome Screen -->
  <div id="welcomeScreen" class="screen visible">
    <h1>Welcome!</h1>
    <p>Do you want to complete a puzzle to unlock the box?</p>
    <button onclick="goToPuzzleChoice()">Yes</button>
  </div>

  <!-- Puzzle Choice Screen -->
  <div id="puzzleChoiceScreen" class="screen">
    <h2>Choose an option</h2>
    <button onclick="goToRiddle()">Solve a Riddle</button>
    <button onclick="goToTrig()">Answer a Trig Question</button>
    <button onclick="showPinPad()">Enter PIN</button>
  </div>

  <!-- Riddle Screen -->
  <div id="riddleScreen" class="screen">
    <h2>Riddle:</h2>
    <p>I speak without a mouth and hear without ears. I have nobody, but I come alive with the wind. What am I?</p>
    <button onclick="goToLockScreen()">Echo</button>
    <button onclick="goToPuzzleChoice()">Back</button>
  </div>

  <!-- Trig Screen -->
  <div id="trigScreen" class="screen">
    <h2>Trig Question:</h2>
    <p>What is sin(30°)?</p>
    <button onclick="goToLockScreen()">0.5</button>
    <button onclick="goToPuzzleChoice()">Back</button>
  </div>

  <!-- PIN Screen -->
  <div id="pinScreen" class="screen">
    <h2>Enter PIN</h2>
    <div id="pinDisplay" style="font-size: 30px; margin: 20px;">____</div>
    <div id="pinPad">
      <button onclick="addDigit(1)">1</button>
      <button onclick="addDigit(2)">2</button>
      <button onclick="addDigit(3)">3</button><br>
      <button onclick="addDigit(4)">4</button>
      <button onclick="addDigit(5)">5</button>
      <button onclick="addDigit(6)">6</button><br>
      <button onclick="addDigit(7)">7</button>
      <button onclick="addDigit(8)">8</button>
      <button onclick="addDigit(9)">9</button><br>
      <button onclick="clearPin()">Clear</button>
      <button onclick="addDigit(0)">0</button>
      <button onclick="submitPin()">Enter</button>
    </div>
    <br>
    <button onclick="goToPuzzleChoice()">Back</button>
  </div>

  <!-- Lock Screen -->
  <div id="lockScreen" class="screen">
    <h2>Box Control</h2>
    <button onclick="lockBox()">Lock</button>
    <button onclick="unlockBox()">Unlock</button>
    <br><br>
    <button onclick="goToWelcome()">Back to Home</button>
  </div>

  <script>
    let currentPin = "";

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(div => {
        div.classList.remove('visible');
      });
      document.getElementById(screenId).classList.add('visible');
    }

    function goToWelcome() {
      showScreen("welcomeScreen");
    }

    function goToPuzzleChoice() {
      showScreen("puzzleChoiceScreen");
    }

    function goToRiddle() {
      showScreen("riddleScreen");
    }

    function goToTrig() {
      showScreen("trigScreen");
    }

    function showPinPad() {
      currentPin = "";
      updatePinDisplay();
      showScreen("pinScreen");
    }

    function addDigit(digit) {
      if (currentPin.length < 4) {
        currentPin += digit.toString();
        updatePinDisplay();
      }
    }

    function clearPin() {
      currentPin = "";
      updatePinDisplay();
    }

    function updatePinDisplay() {
      document.getElementById("pinDisplay").innerText = currentPin.padEnd(4, "_");
    }

    function submitPin() {
      if (currentPin === "7114") {
        goToLockScreen();
      } else {
        alert("Incorrect PIN");
        clearPin();
      }
    }

    function goToLockScreen() {
      showScreen("lockScreen");
    }

    function lockBox() {
      alert("Box is now locked.");
      goToWelcome();
    }

    function unlockBox() {
      alert("Box is now unlocked.");
    }

    // Start at welcome screen
    goToWelcome();
  </script>
</body>
</html>
